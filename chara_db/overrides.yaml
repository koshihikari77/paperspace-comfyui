# chara_db の手動設定。編集したら:
#   python scripts/chara_db.py roster && python scripts/chara_db.py build
#
# exclude_branches: 所属名(部分一致)で除外
# male_branches:    この所属は男性として除外
# male / female:    個別の性別指定(id は rosters/<franchise>.json の id)
# exclude:          個別に除外
# aliases:          Civitai 側の表記ゆれ
# pin:              選定を固定 {id: civitai modelId}
# keep_file:        選定を無視して既存ミラーファイルを主にする {id: ファイル名}(改名しない)
# legacy_files:     キャラに紐づく既存ミラーファイル(主にならなければ alternates)

